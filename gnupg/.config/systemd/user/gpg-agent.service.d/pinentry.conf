[Service]
# Always use pinentry-gnome3 via Fedora's /usr/bin/pinentry wrapper, even when
# gpg-agent is invoked by a headless/systemd caller (e.g. mbsync) without
# DISPLAY/WAYLAND_DISPLAY. pinentry-gnome3 reads passphrases saved in the
# GNOME Login keyring (org.freedesktop.secrets / oo7-daemon) over D-Bus without
# prompting, and falls back to curses if no GNOME session is active.
Environment=PINENTRY_BINARY=/usr/bin/pinentry-gnome3
