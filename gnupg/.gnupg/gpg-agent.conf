# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ gpg-agent configuration (~/.gnupg/gpg-agent.conf)                         ║
# ║                                                                           ║
# ║ Note:                                                                     ║
# ║ After changing the configuration, reload the agent:                       ║
# ║   $ gpg-connect-agent reloadagent /bye                                    ║
# ╚═══════════════════════════════════════════════════════════════════════════╝


# Passphrase cache (seconds). On Fedora/GNOME, pinentry-gnome3 transparently
# retrieves saved passphrases from the unlocked Login keyring (oo7-daemon), so
# these only limit how long gpg-agent holds the key in its own memory (and act
# as the cache window in headless SSH or macOS sessions).
# 1 hour idle, 8 hours max (GnuPG defaults: 600 / 7200).
default-cache-ttl 3600
max-cache-ttl 28800
