name: Neovim Config Tests

on:
  push:
    branches: [master]
    paths:
      - "neovim/**"
      - ".github/workflows/neovim-tests.yml"
  pull_request:
    paths:
      - "neovim/**"
      - ".github/workflows/neovim-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the versions used locally.
  NVIM_VERSION: v0.12.5
  TREE_SITTER_VERSION: v0.26.11 # nvim-treesitter (main) needs >= 0.26.1 to build parsers

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim ${{ env.NVIM_VERSION }}
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install tree-sitter CLI ${{ env.TREE_SITTER_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/tree-sitter/tree-sitter/releases/download/${TREE_SITTER_VERSION}/tree-sitter-linux-x64.gz" \
            | gunzip > "$RUNNER_TEMP/bin/tree-sitter"
          chmod +x "$RUNNER_TEMP/bin/tree-sitter"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install ripgrep and fd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep fd-find

      - name: Versions
        run: |
          nvim --version | head -1
          tree-sitter --version

      # Plugins (at their lazy-lock.json commits), built parsers and mini.test.
      - name: Cache test sandbox
        uses: actions/cache@v6
        with:
          path: neovim/.tests
          key: neovim-tests-${{ runner.os }}-${{ env.NVIM_VERSION }}-${{ hashFiles('neovim/.config/nvim/lazy-lock.json', 'neovim/.config/nvim/lua/plugins/treesitter.lua', 'neovim/Makefile') }}
          restore-keys: |
            neovim-tests-${{ runner.os }}-${{ env.NVIM_VERSION }}-

      - name: Run tests
        run: make -C neovim test
